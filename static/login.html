<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaia AEO — Ingreso</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f4f2;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border:1px solid #e2e4e2;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.08);width:100%;max-width:360px;padding:28px 26px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#0F6E56,#5DCAA5);display:flex;align-items:center;justify-content:center;font-size:22px}
h1{font-size:16px;font-weight:700}
.sub{font-size:11px;color:#888;margin:2px 0 20px}
label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#666;margin:12px 0 5px}
input{width:100%;border:1.5px solid #ddd;border-radius:9px;padding:10px 12px;font-size:14px;outline:none;transition:border .15s}
input:focus{border-color:#0F6E56}
button{width:100%;margin-top:20px;background:#0F6E56;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .12s}
button:hover{background:#085041}
button:disabled{background:#8fbdaf;cursor:wait}
.err{margin-top:14px;font-size:12px;color:#B91C1C;background:#FCEBEB;border:1px solid #F3C6C6;border-radius:8px;padding:8px 11px;display:none}
.foot{margin-top:16px;font-size:10px;color:#aaa;text-align:center}
</style>
</head>
<body>
  <form class="card" id="loginForm" onsubmit="return doLogin(event)">
    <div class="brand"><div class="logo">🌱</div>
      <div><h1>Gaia AEO Observability</h1><div class="sub">Ingreso al panel</div></div>
    </div>
    <label for="u">Usuario</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Ingresar</button>
    <div class="err" id="err"></div>
    <div class="foot">Acceso restringido · Gaia School Costa Rica</div>
  </form>
<script>
async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  err.style.display='none'; btn.disabled=true; btn.textContent='Ingresando…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){ location.href='/'; return false; }
    err.textContent='Usuario o contraseña inválidos.'; err.style.display='block';
  }catch(_){ err.textContent='Error de conexión.'; err.style.display='block'; }
  btn.disabled=false; btn.textContent='Ingresar';
  return false;
}
</script>
</body>
</html>
